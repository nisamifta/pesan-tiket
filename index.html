<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Tiket Dies Natalis</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <p class="subtitle">SPECIAL EVENT</p>
            <h1>DIES NATALIS</h1>
            <h2>Music Festival 2026</h2>
            <p class="description">
                Rayakan momen spesial bersama musik,
                kebersamaan, dan kenangan tak terlupakan!
            </p>
        </div>

        <div class="form-box">
            <h2>Formulir Pemesanan Tiket</h2>
            <p class="info">Silakan lengkapi data pemesanan berikut.</p>

            <form>

                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama lengkap" required>

                <label>Kelas</label>
                <input type="text" placeholder="Contoh: X RPL 2" required>

                <label>Nomor HP</label>
                <input type="tel" placeholder="Masukkan nomor HP" required>

                <label>Email</label>
                <input type="email" placeholder="Masukkan email" required>

                <label>Pilih Jenis Tiket</label>
                <select required>
                    <option value="">-- Pilih Tiket --</option>
                    <option>Regular - Rp25.000</option>
                    <option>VIP - Rp50.000</option>
                    <option>VVIP - Rp75.000</option>
                </select>

                <label>Jumlah Tiket</label>
                <input type="number" min="1" max="10"
                    placeholder="Masukkan jumlah tiket" required>

                <label>Tanggal Pemesanan</label>
                <input type="date" required>

                <label>Metode Pembayaran</label>
                <select required>
                    <option value="">-- Pilih Pembayaran --</option>
                    <option>Transfer Bank</option>
                    <option>QRIS</option>
                    <option>Tunai</option>
                </select>

                <label>Catatan Tambahan</label>
                <textarea rows="4"
                    placeholder="Tulis catatan jika ada..."></textarea>

                <button type="submit">PESAN TIKET SEKARANG</button>

            </form>
        </div>

        <footer>
            <p>© 2026 Dies Natalis Music Festival</p>
            <p>See You at the Concert!</p>
        </footer>

    </div>

</body>
  </html>
